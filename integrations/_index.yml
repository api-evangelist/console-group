status_note: |
  Every entry below is LISTING-ONLY. No Arazzo workflow could be authored for any of
  them because Console Group publishes no OpenAPI, no operationIds and no integration
  documentation of any kind — a 2-source Arazzo needs a machine-readable contract on
  the Console side, and there is none. The marketplace itself is the proof that a
  private integration API exists: roughly twenty named third-party products are
  described as two-way integrations with Console Cloud / Reapit PM. Nothing about how
  they connect is published. Partner-side specs are noted where the partner is already
  profiled in the API Evangelist network.
