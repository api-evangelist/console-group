scope_note: |
  These are END-USER product release notes for Console Cloud / Reapit PM, not an API
  changelog. Console Group publishes no API and therefore no API changelog, no
  breaking-change policy and no migration notes. The page is captured because it is
  the only dated release surface the company operates, and because the integration
  entries in it are the clearest public evidence of the private integration API.
