aid: console-group
name: Console Group
review:
  question: Does Console Group publish a reachable, documented public API surface for
    Australian property management, and what is its RESO posture?
  answer: false
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: property-management
  specsHarvested: 0
  openapiDirectoryCreated: false

resoPosture:
  certified: false
  posture: No RESO reference found anywhere on console.com.au or in any Console Group
    or parent-group documentation. Australia has no MLS, so there is nothing to
    certify against.
  webApiCertification: none found
  dataDictionaryCertification: none found
  dataDictionaryVersion: null
  certificationDirectoryEvidence: |
    No RESO certification directory listing was found for Console Group, Console
    Cloud, or Reapit PM. RESO certification is a North American, NAR-driven
    construct tied to MLS participation. Australia's residential market is a
    portal duopoly — REA Group's realestate.com.au and Domain — sitting over
    state land registries, PEXA for electronic conveyancing, and PropTrack /
    CoreLogic for valuation. There is no cooperative MLS database in Australia
    and therefore no RESO certification programme that an Australian property
    management vendor could participate in.
  odataEndpoints: none found
  metadataDocument:
    probed:
    - url: https://www.console.com.au/$metadata
      status: 404
      note: Webflow marketing site 404 page returned; not an OData service.
    result: No OData $metadata document is served by Console Group on any probed host.
  universalPropertyIdentifier:
    present: false
    note: No UPI, no RESO Data Dictionary field naming, and no OData conventions
      appear anywhere in Console Group's public material.
  searchedFor:
  - RESO Web API certification
  - RESO Data Dictionary certification and version
  - RESO certification directory listing
  - Reso / OData endpoints
  - $metadata documents
  - Universal Property Identifier (UPI)
  grepEvidence: |
    A case-insensitive grep for "RESO", "Data Dictionary", "OData", "Universal
    Property Identifier" and "UPI" across the fetched console.com.au homepage and
    across the parent group's full developer documentation corpus
    (foundations-documentation.reapit.cloud readme.md, api.md,
    api/api-documentation.md, platform-glossary.md, developer-terms-and-conditions.md,
    listing-your-app.md, faqs.md) returned zero substantive matches. The only hits
    were unrelated substrings.

accessGate:
  gate: partner-only
  gated: true
  whatADeveloperMustSignOrJoin: |
    Nothing is published. Console Group operates a live integration marketplace at
    https://www.console.com.au/integrate listing roughly eighteen third-party
    products (MyConnect, Tapi, Inspection Express, Bricks + Agent, Snug, DEFT,
    REI Forms Live, Property Inspection Manager, Inspection Manager, Move Me In,
    FastConnect, YourPorter, Compare and Connect, Movinghub, plus native Reapit PM
    Inspect, Console Pay, Reapit Sales, InspectRealEstate and Agentbox), which is
    direct evidence that a working private integration API exists. But that page
    carries no developer documentation, no API reference, no "become an integration
    partner" call to action and no application form. The /partners page is a list of
    ten certified TRAINING partners for property managers, not a technology partner
    programme. The only published route to the company for a would-be integrator is
    the generic /contact-us and /book-a-demo forms. The honest classification is
    therefore partner-only: entry is by commercial arrangement negotiated privately,
    with no self-serve signup, no application form and no published terms. A reader
    who prefers the strictest reading could call this none-published; partner-only
    is chosen because the operating marketplace proves a route exists even though
    the route itself is unpublished.
  selfServeSignup: false
  applicationForm: false
  mlsOrBoardMembership: not applicable — Australia has no MLS
  idxOrVowLicence: not applicable — Australia has no IDX/VOW regime
  brokerOrAgentSponsorship: false
  note: Console Group's own customers are licensed real estate agencies, so the
    software itself is sold to agencies; but that is a software sale, not an API
    access gate, and no API is offered to those customers as a published product.

openData:
  present: false
  note: |
    Console Group is a private SaaS vendor holding its customers' trust accounting,
    tenancy and rent-roll data. It publishes no open dataset of any kind. The
    Australian open counterweight to private control sits with government — state
    land registries (several now privatised, e.g. NSW Land Registry Services,
    Victoria's LANDATA), the ABS, and data.gov.au — not with property management
    software vendors. Nothing open-data-shaped is published by Console Group.

