actions:
  apisYmlCreated: true
  readmeCreated: true
  openapiDirectoryCreated: false
  apisListed: 0
  reason: |
    Bootstrap recorded as a built-stub. Identity, market position, product family
    and legal/marketing properties captured in apis.yml with an empty apis[] block,
    which is the correct and expected outcome for a property management vendor with
    no published developer surface. RESO posture, access gate, open-data posture
    and auth model recorded verbatim above with the HTTP status of every URL
    probed. No spec, host, endpoint or scope was invented.
