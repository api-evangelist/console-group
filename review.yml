findings:
  summary: |
    Console Group has NO public developer surface of its own. This is the honest
    answer and it is not a research failure — it was established by probing the
    primary domain, four developer-shaped subdomains, three developer-shaped paths,
    nine paths on a live api. host, the full sitemap, robots.txt, the marketplace
    page, the partners page and the help centre.

    The company is real and substantial: founded 1992 in Brisbane, first property
    management software released in Australia, Console Cloud launched 2017,
    thousands of agency customers across Australia and New Zealand, now owned by
    the United Kingdom's Reapit and rebranded Reapit PM while still trading from
    console.com.au. It sits on the property MANAGEMENT side of the Australian
    value chain — the system of record for the rent roll, the trust account and
    the tenancy — which is a different seam from listings (REA Group, Domain),
    from conveyancing settlement (PEXA) and from valuation (PropTrack, CoreLogic).

    An integration API demonstrably exists behind the curtain: the /integrate page
    lists roughly eighteen live third-party products including maintenance (Bricks
    + Agent, Tapi), utility connections (MyConnect, Movinghub, Compare and Connect),
    applications (Snug), forms (REI Forms Live), payments (DEFT) and inspections
    (Inspection Express, Property Inspection Manager). Those integrations cannot
    exist without an API. But not one byte of that API is documented publicly. No
    reference, no OpenAPI, no Swagger, no Postman collection, no SDK, no webhooks
    documentation, no scopes, no rate limits, no sandbox, no status page.
  centralQuestion: |
    CERTIFICATION IS NOT REACHABILITY — and in Australia there is no certification
    either. Console Group is the clean negative case on both axes: RESO is entirely
    absent (nothing to certify against without an MLS), AND the endpoint is
    unreachable (nothing published). Compare this to the American pattern where a
    RESO-certified Web API endpoint exists and is directory-listed yet still
    requires an MLS membership and a signed IDX or VOW data licence before a single
    call succeeds. Console Group has neither the certification badge nor the open
    door. Recording both facts separately is the point: the absence of RESO here
    says something about the Australian market structure (portal duopoly, no
    cooperative database, PEXA as the only genuinely mandated national
    machine-readable property rail), while the absence of a portal says something
    about this specific vendor's API strategy.
  parentCompanyCaveat: |
    Reapit, the parent, DOES operate a genuine developer platform — Reapit
    Foundations, with public documentation at foundations-documentation.reapit.cloud,
    a registration form at developers.reapit.cloud/register, Reapit Connect OpenID
    Connect authentication with a live anonymous discovery document, a REST API,
    GraphQL, webhooks and an alpha MCP server. It would be WRONG to credit that to
    Console Group. A case-insensitive grep across the entire Foundations
    documentation corpus for "Console", "Console Cloud", "Reapit PM", "Australia",
    "New Zealand" and "ANZ" returned ZERO matches: Foundations documents the UK
    AgencyCloud product line, not the ANZ Console platform. Reapit is profiled
    separately at all/reapit. Console Group's own posture stands on its own
    evidence, and that evidence says nothing is published. Additionally, even
    Foundations' own Swagger document is 401-gated at platform.reapit.cloud, so
    no machine-readable contract could be harvested anonymously from either
    company.
  whyNoSpecsSaved: |
    The openapi/ directory was deliberately NOT created. No OpenAPI, Swagger,
    OData $metadata, GraphQL SDL or AsyncAPI document belonging to Console Group
    was found anywhere. The two 200 responses that superficially looked like specs
    (developers.reapit.cloud/swagger.json and platform.reapit.cloud/docs) were both
    verified and rejected: the first returns an HTML SPA shell, the second returns
    a JSON error object. Neither is a spec, and neither belongs to Console Group in
    any case. Nothing was invented, inferred or reconstructed.

