name: Console Group
kind: company
description: Console Group is an Australian property management software company, founded
  in 1992 in Brisbane, Queensland, that built the first property management and trust accounting
  software released in Australia and launched its cloud platform, Console Cloud, in 2017.
  It serves thousands of residential and commercial property management agencies across Australia
  and New Zealand with trust accounting, tenancy and lease management, inspections (Console
  Go + Inspect), maintenance, arrears, owner and tenant portals, SMS, analytics and payments
  (Console Pay). The company was acquired by the United Kingdom's Reapit and its flagship
  product has been rebranded Reapit PM, though the business continues to trade from console.com.au.
  In the Australian value chain Console Group sits on the property MANAGEMENT side rather
  than the sales-listing side, as the system of record for the rent roll, the trust account
  and the tenancy, downstream of REA Group's realestate.com.au and Domain and separate from
  PEXA's conveyancing rail and from PropTrack and CoreLogic valuation data. Its API posture
  is honestly closed. Console Group publishes no developer portal, no API reference, no OpenAPI
  or Swagger document and no partner developer program on console.com.au; the full sitemap
  contains no /developers, /api or /docs page, and the developer., developers. and docs. subdomains
  do not resolve. An api.console.com.au host answers as a Kong API Gateway but returns
  "no Route matched with those values" on every probed path, including GraphQL. A live
  integration marketplace at /integrate lists more than twenty two-way third-party products,
  so a working private integration API demonstrably exists, but access is by commercial marketplace
  arrangement only and nothing about it is published. The company does run a real public status
  page at status.console.com.au (Hund.io, Cloud and Accounts components, published uptime and
  response-time metrics), though its HAL+JSON status API is credential-gated. Australia has no
  MLS, so there is no RESO Web API or Data Dictionary certification, no OData $metadata document
  and no Universal Property Identifier anywhere in Console Group's stack, and the company
  publishes no open data.
